<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bin Eats the Label</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Bin Eats the Label</h1>
    <p class="sub">Click the button – the bin eats the label.</p>
    <div id="demo">
      <div>
        <div class="stage">
          <button class="del-btn"><span class="label">Delete</span>
            <svg class="bin" viewBox="0 0 24 24"><g class="lid"><path d="M4 7h16M9 7V4h6v3"/></g><path d="M6 7l1 13h10l1-13"/></svg>
          </button>
        </div>
      </div>
      <div>
        <div class="stage dark">
          <button class="del-btn"><span class="label">Delete</span>
            <svg class="bin" viewBox="0 0 24 24"><g class="lid"><path d="M4 7h16M9 7V4h6v3"/></g><path d="M6 7l1 13h10l1-13"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
